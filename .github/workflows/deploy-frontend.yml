name: Deploy frontend to easyname

# Builds the Astro site (pulling live content from WordPress at wp.m1o.at) and
# uploads the static output to easyname over FTPS. Runs on push to frontend/**,
# on a manual trigger, and nightly (so new WordPress content goes live daily).
#
# The upload step is SKIPPED (job stays green) until the FTP secrets are set, so
# an unconfigured repo never shows a red check. Add these under
# Settings → Secrets and variables → Actions:
#   FTP_SERVER      easyname FTP host, e.g. ftp.raveenthiran.com
#   FTP_USERNAME    easyname FTP user
#   FTP_PASSWORD    easyname FTP password
# Optional:
#   FTP_SERVER_DIR  target dir on the host (default "./"), e.g. /html/ or /raveenthiran.com/
#   WP_BASE         override the WordPress REST base (default is baked into wp.ts)

on:
  push:
    branches: [ "Theme-folder", "claude/headless-wordpress-easyname-8eu9fj" ]
    paths: [ "frontend/**", ".github/workflows/deploy-frontend.yml" ]
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * *"   # 04:00 UTC daily rebuild

permissions:
  contents: read

concurrency:
  group: deploy-frontend
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build (pulls content from WordPress)
        working-directory: frontend
        env:
          WP_BASE: ${{ secrets.WP_BASE }}
        run: npm run build

      - name: Generate OG share cards
        working-directory: frontend
        run: |
          npm i --no-save playwright@^1.48
          npx playwright install --with-deps chromium
          node scripts/og.mjs

      - name: Check deploy config
        id: cfg
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          if [ -n "$FTP_SERVER" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Deploy skipped::FTP secrets are not set yet — built dist/ but did not upload. Add FTP_SERVER / FTP_USERNAME / FTP_PASSWORD to enable deploy."
          fi
          if [ -n "$CF_ZONE_ID" ] && [ -n "$CF_API_TOKEN" ]; then
            echo "cf=true" >> "$GITHUB_OUTPUT"
          else
            echo "cf=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy dist/ to easyname (FTPS)
        if: steps.cfg.outputs.ready == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./frontend/dist/
          server-dir: ${{ secrets.FTP_SERVER_DIR || './' }}

      # Purge the Cloudflare cache so the new build is visible immediately —
      # no more manual "Purge Everything". Skipped when the CF secrets aren't set.
      - name: Purge Cloudflare cache
        if: steps.cfg.outputs.cf == 'true'
        run: |
          echo "Purging Cloudflare cache for zone ${CF_ZONE_ID:0:6}…"
          resp=$(curl -sS -X POST \
            "https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}/purge_cache" \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}')
          echo "$resp"
          echo "$resp" | grep -q '"success":true' && echo "✅ Cache purged." || echo "::warning::Cloudflare purge did not report success — check CF_ZONE_ID / CF_API_TOKEN."
        env:
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
